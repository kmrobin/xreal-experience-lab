<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  model-viewer { width: 100vw; height: 100vh; background: #000; --poster-color: #000000; }
  #msg {
    position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
    text-align: center; color: #C8B6D0; font-family: -apple-system, Roboto, sans-serif;
    padding: 24px; font-size: 16px;
  }
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
<model-viewer id="mv"
    camera-controls
    touch-action="none"
    interaction-prompt="none"
    shadow-intensity="1"
    exposure="1"
    auto-rotate
    auto-rotate-delay="4000"
    camera-orbit="0deg 75deg 105%"
    min-camera-orbit="auto 0deg auto"
    max-camera-orbit="auto 180deg auto">
</model-viewer>
<div id="msg">Loading model…</div>
<script>
  const mv = document.getElementById('mv');
  const msg = document.getElementById('msg');
  function loadModel(src) {
    msg.style.display = 'block';
    msg.textContent = 'Loading model…';
    mv.src = src;
  }
  mv.addEventListener('load', function () { msg.style.display = 'none'; });
  mv.addEventListener('error', function () {
    msg.style.display = 'block';
    msg.textContent = 'Could not load this model. Check the network or add a .glb under assets/models/.';
  });
  // Head-tracking hook (yaw/pitch in degrees) — drives the orbit camera.
  function setOrbit(yawDeg, pitchDeg) {
    const phi = Math.max(1, Math.min(179, 90 - pitchDeg));
    mv.cameraOrbit = yawDeg + 'deg ' + phi + 'deg auto';
  }

  // DeX/glasses: the phone acts as a trackpad, so a single-finger swipe arrives
  // as a mouse pointer *hover* (no button held) and model-viewer's drag-orbit
  // never triggers. Rotate the model directly from that movement; touch input
  // on the phone still uses model-viewer's native orbit.
  let px = null, py = null, vx = 0, vy = 0, lastMove = 0;
  function rotateBy(dx, dy) {
    const o = mv.getCameraOrbit();
    const theta = o.theta * 180 / Math.PI + dx * 0.4;
    let phi = o.phi * 180 / Math.PI - dy * 0.4;
    phi = Math.max(5, Math.min(175, phi));
    mv.cameraOrbit = theta + 'deg ' + phi + 'deg ' + o.radius + 'm';
  }
  mv.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    if (px !== null) {
      const dx = e.clientX - px, dy = e.clientY - py;
      vx = dx; vy = dy;
      rotateBy(dx, dy);
    }
    px = e.clientX; py = e.clientY;
    lastMove = performance.now();
  });
  ['pointerleave', 'pointerup', 'pointercancel'].forEach(function (ev) {
    mv.addEventListener(ev, function () { px = null; py = null; });
  });
  // Momentum: when the trackpad cursor stalls at the screen edge (or a swipe is
  // flicked), keep spinning from the last velocity so a full 360 needs no
  // repeated edge-to-edge dragging.
  function inertia() {
    if (performance.now() - lastMove > 55 && (Math.abs(vx) > 0.15 || Math.abs(vy) > 0.15)) {
      rotateBy(vx, vy);
      vx *= 0.94; vy *= 0.94;
    }
    requestAnimationFrame(inertia);
  }
  requestAnimationFrame(inertia);
</script>
</body>
</html>
